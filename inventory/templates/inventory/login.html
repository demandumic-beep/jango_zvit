{% load static %}<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вхід | StockLogix</title>
    <link rel="stylesheet" href="{% static 'inventory/css/shop.css' %}">
    <style>
        .login-divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 18px 0;
            color: #8b8fa3;
            font-size: 13px;
        }
        .login-divider::before,
        .login-divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: rgba(255, 255, 255, 0.15);
        }
        .google-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 11px 16px;
            border: 1px solid #dadce0;
            border-radius: 10px;
            background: #fff;
            color: #3c4043;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: box-shadow .15s, background .15s;
        }
        .google-btn:hover {
            background: #f7f8f8;
            box-shadow: 0 1px 4px rgba(0, 0, 0, .25);
        }
        .google-btn svg { width: 20px; height: 20px; }
    </style>
</head>
<body>
<main class="login-wrap">
    <div class="login-card">
        <a href="{% url 'shop' %}" class="shop-brand">
            <span class="shop-logo">S</span> Stock<span>Logix</span>
        </a>
        <h1>Вхід</h1>
        <p class="muted">Співробітники входять за логіном і паролем, покупці можуть увійти через Google.</p>

        {% if error %}<div class="shop-message error">{{ error }}</div>{% endif %}

        <form method="post" class="form-card">
            {% csrf_token %}
            <input type="hidden" name="next" value="{{ next }}">
            <label>Логін
                <input type="text" name="username" autocomplete="username" required autofocus>
            </label>
            <label>Пароль
                <input type="password" name="password" autocomplete="current-password" required>
            </label>
            <button type="submit" class="submit-btn">Увійти</button>
        </form>

        {% if google_login_enabled %}
            <div class="login-divider"></div>

            <form method="post" action="{% url 'google_login' %}">
                {% csrf_token %}
                <!-- <button type="submit" class="google-btn">
                    <svg viewBox="0 0 48 48" aria-hidden="true">
                        <path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/>
                        <path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.5 5.8c4.4-4.1 7.1-10.1 7.1-17.5z"/>
                        <path fill="#FBBC05" d="M10.5 28.7c-.5-1.5-.8-3.1-.8-4.7s.3-3.2.8-4.7l-7.9-6.1C.9 16.4 0 20.100 0 24s.9 7.600 2.600 10.800l7.900-6.100z"/>
                        <path fill="#34A853" d="M24 48c6.500 0 11.900-2.100 15.900-5.800l-7.500-5.800c-2.100 1.400-4.800 2.300-8.400 2.300-6.300 0-11.600-4.100-13.500-9.800l-7.900 6.100C6.500 42.600 14.600 48 24 48z"/>
                    </svg>
                    Увійти через Google
                </button> -->
            </form>
        {% endif %}

        <p><a href="{% url 'shop' %}" class="muted">← До магазину</a></p>
    </div>
</main>
</body>
</html>
